[package]
name = "horizon-account"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Microsoft account sign-in for the game (the launcher's flow): device code, Xbox Live, XSTS, the Minecraft services"

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

